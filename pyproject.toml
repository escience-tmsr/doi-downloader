# For information on how to add or adjust this file, see e.g. the following documentation:
# - https://packaging.python.org/en/latest/specifications/declaring-project-metadata/#declaring-project-metadata
# - https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
# - https://www.python.org/dev/peps/pep-0621/

[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [
    { name = "Erik Tjong Kim Sang", email = "e.tjongkimsang@esciencecenter.nl" },
    { name = "Reggie Cushing" },
    { name = "Kody Moodley" },
    { name = "Sander van Rijn", email = "s.vanrijn@esciencecenter.nl" },
]
dependencies = [
    "bs4",
    "duckdb",
    "jsonschema",
    "playwright",
    "pypdf",
    "python-dotenv",
    "regex",
    "requests",
    "responses",
]
description = "Utility to download PDF files for scientific articles based on their DOI."
keywords = ["doi","download","articles"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
name = "doi_downloader"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { file = "doi_downloader/VERSION" }

[project.optional-dependencies]
examples = [
    "polars",
    "termcolor",
]

[dependency-groups]
dev = [
    "coverage [toml]",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-dotenv",
    "ruff",
]
docs = [
    "mkdocs",
]
publishing = [
    "build",
    "bump-my-version",
    "gitchangelog",
    "twine",
    "wheel",
]

[project.urls]
Repository = "https://github.com/escience-tmsr/doi-downloader"
Issues = "https://github.com/escience-tmsr/doi-downloader/issues"
Documentation = "https://escience-tmsr.github.io/doi-downloader/"

[tool.setuptools.packages.find]
include = ["doi_downloader*"]

[tool.mypy]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
env_files = [
    ".env",
    ".test.env",
    ".deploy.env",
]

[tool.coverage.run]
branch = true
source = ["doi_downloader"]
command_line = "-m pytest"

[tool.ruff]
line-length = 120
extend-exclude = ["docs"]
target-version = "py311"

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Enable Pyflakes `E` and `F` codes by default.
extend-select = ["E", "F"]
ignore = [
    "ANN204", # Missing return type annotation for special (dunder) method
    "FBT",    # Using boolean function arguments
    "TD",     # TODOs
    "FIX001", # Resolve FIXMEs
    "FIX002", # Resolve TODOs
    "B028",   # No explicit `stacklevel` keyword argument found in warning
    "COM812", # Trailing commas are taken care of by `ruff format`
    # No docstrings required in the following cases
    "D100", # Missing module docstring
    "D104", # Missing public package docstring
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in `__init__`
    # TODO: These ignores are temporary and should be resolved in code
    "BLE001",  # Catching bare Exceptions
    "PLW0602", # Not assigning to global variable
    "TRY002",  # Creating own exception
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests can ignore a few extra rules
"tests/**.py" = [
    "ANN201", # Missing return type annotation for public function
    "PT011",  # Missing `match` parameter in `pytest.raises()`
    "S101",   # Use of assert is detected
]

[tool.ruff.lint.isort]
known-first-party = ["doi_downloader"]
no-lines-before = ["future", "local-folder"]


[tool.bumpversion]
current_version = "1.0.0"

[[tool.bumpversion.files]]
filename = "doi_downloader/VERSION"
[[tool.bumpversion.files]]
filename = "pyproject.toml"
